<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="260" viewBox="0 0 1230 260" role="img"><title>Model and explicit assumptions lead to a native answer and source-linked proof</title><rect width="1230" height="260" rx="20" fill="#f5f0e5"/><g font-family="Arial, Helvetica, sans-serif" fill="#15263d"><text x="34" y="45" font-size="17" fill="#246c65">FROM EXPLICIT ASSUMPTIONS TO A CHECKABLE ANSWER</text><rect x="34" y="80" width="260" height="100" rx="12" fill="white"/><text x="52" y="119" font-size="25" fill="#15263d">Model</text><text x="52" y="155" font-size="15" fill="#15263d">Pinned claims + source edition</text><text x="304" y="137" font-size="24" fill="#246c65">→</text><rect x="334" y="80" width="260" height="100" rx="12" fill="white"/><text x="352" y="119" font-size="25" fill="#15263d">Input</text><text x="352" y="155" font-size="15" fill="#15263d">Facts + assumptions + context</text><text x="604" y="137" font-size="24" fill="#246c65">→</text><rect x="634" y="80" width="260" height="100" rx="12" fill="white"/><text x="652" y="119" font-size="25" fill="#15263d">Answer</text><text x="652" y="155" font-size="15" fill="#15263d">Value proposition + truth status</text><text x="904" y="137" font-size="24" fill="#246c65">→</text><rect x="934" y="80" width="260" height="100" rx="12" fill="white"/><text x="952" y="119" font-size="25" fill="#15263d">Proof</text><text x="952" y="155" font-size="15" fill="#15263d">Rules + textbook fragments</text><text x="34" y="223" font-size="16" fill="#15263d">Calculations run in the shared Arxo models and engine. Source capture and delivery scripts only prepare data.</text></g></svg>
