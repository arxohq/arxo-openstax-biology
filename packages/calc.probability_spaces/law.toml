[package]
name = "calc.probability_spaces"
version = "0.1.0"
language = "0.2"
namespace = "urn:law:calc:probability-spaces"

[features]
semanticLayer = "L0"

[[tests]]
family = "calc.probability_spaces#authored"
regression = false
suites = [
    "tests/01-fair-coin-ok.lawtest",
    "tests/02-event-prob-ok.lawtest",
    "tests/03-sum-mismatch.lawtest",
    "tests/04-negative-prob.lawtest",
    "tests/05-conditional-ok.lawtest",
    "tests/06-conditional-mismatch.lawtest",
    "tests/07-independence-ok.lawtest",
    "tests/08-independence-fail.lawtest",
    "tests/09-bayes-ok.lawtest",
    "tests/10-bayes-mismatch.lawtest",
    "tests/11-event-mismatch.lawtest",
    "tests/12-rv-expectation.lawtest",
    "tests/13-rv-joint.lawtest",
    "tests/14-rv-defects.lawtest",
]
world = ["calc.probability_spaces"]

[authoring]
local_imports = "explicit"
